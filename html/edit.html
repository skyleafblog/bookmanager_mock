<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>書籍編集 — モック</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/book-form.css">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <img src="../image/logo-origin.png" class="header-logo" alt="SKYLEAF">
        <span class="site-title">書籍管理システム</span>
        <div class="header-actions">
            <span class="login-user">管理者 さん</span>
            <a href="login.html" class="btn btn-sm">ログアウト</a>
        </div>
    </div>
</header>

<main class="container">

    <div class="page-header">
        <h2>書籍編集</h2>
        <a href="list.html" class="btn">一覧へ戻る</a>
    </div>

    <form class="book-form" onsubmit="handleSubmit(event)" novalidate>

        <div class="form-group" id="group-title">
            <label for="title">タイトル <span class="required">*</span></label>
            <input type="text" id="title" maxlength="100" value="Javaプログラミング入門">
            <span class="error-message" id="err-title" style="display:none;">タイトルは必須です</span>
        </div>

        <div class="form-group" id="group-author">
            <label for="author">著者 <span class="required">*</span></label>
            <input type="text" id="author" maxlength="100" value="山田 太郎">
            <span class="error-message" id="err-author" style="display:none;">著者は必須です</span>
        </div>

        <div class="form-group" id="group-category">
            <label for="categoryId">カテゴリ <span class="required">*</span></label>
            <select id="categoryId">
                <option value="">— 選択してください —</option>
                <option value="1" selected>プログラミング</option>
                <option value="2">データベース</option>
                <option value="3">ネットワーク</option>
                <option value="4">セキュリティ</option>
                <option value="5">マネジメント</option>
            </select>
            <span class="error-message" id="err-category" style="display:none;">カテゴリは必須です</span>
        </div>

        <div class="btn-row form-actions">
            <button type="submit" class="btn">更新する</button>
            <a href="detail.html" class="btn">キャンセル</a>
        </div>
    </form>

</main>

<footer class="site-footer">
    <p>&copy; 2026 SKYLEAF. All rights reserved.</p>
</footer>

<!-- モックナビゲーター -->
<nav id="mock-nav">
    <strong>📄 書籍編集画面</strong>
    <div class="divider"></div>
    <a href="#" onclick="showErrors(); return false;">バリデーションエラーを表示</a>
    <div class="divider"></div>
    <a href="list.html">書籍一覧画面</a>
</nav>

<script src="../js/edit.js"></script>
</body>
</html>
